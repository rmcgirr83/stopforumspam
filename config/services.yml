services:
    _defaults:
        autowire: true
        bind:
            $auth: '@auth'
            $cache: '@cache'
            $config: '@config'
            $content_visibility: '@content.visibility'
            $container: '@service_container'
            $db: '@dbal.conn'
            $helper: '@controller.helper'
            $language: '@language'
            $log: '@log'
            $request: '@request'
            $template: '@template'
            $user: '@user'
            $root_path: '%core.root_path%'
            $php_ext: '%core.php_ext%'
            $sfsgroups: '@phpbbmodders.stopforumspam.core.sfsgroups'
            $sfsapi: '@phpbbmodders.stopforumspam.core.sfsapi'
            $contactadmin: '@?phpbbmodders.contactadmin.main.controller'

    phpbbmodders.stopforumspam.admin.controller:
        class: phpbbmodders\stopforumspam\controller\admin_controller

    phpbbmodders.stopforumspam.mainlistener:
        class: phpbbmodders\stopforumspam\event\main_listener
        tags:
            - { name: event.listener }

    phpbbmodders.stopforumspam.core.reporttosfs:
        class: phpbbmodders\stopforumspam\core\reporttosfs

    phpbbmodders.stopforumspam.core.report_pm_to_sfs:
        class: phpbbmodders\stopforumspam\core\report_pm_to_sfs

    phpbbmodders.stopforumspam.core.sfsgroups:
        class: phpbbmodders\stopforumspam\core\sfsgroups

    phpbbmodders.stopforumspam.core.sfsapi:
        class: phpbbmodders\stopforumspam\core\sfsapi
